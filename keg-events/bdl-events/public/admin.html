<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152b5a">
  <title>Manage events | BDL Events</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="/admin.html"><span class="brand-mark">BDL</span><span class="brand-sub">Manage events</span></a>
      <nav class="bar-actions">
        <a class="btn-bar" href="/" target="_blank" rel="noopener">View calendar</a>
        <button class="btn-bar" id="signOut" type="button" hidden>Sign out</button>
      </nav>
    </div>
  </header>

  <div class="gate" id="login" hidden>
    <form class="gate-card form" id="loginForm">
      <h1>Manage events</h1>
      <p>Sign in to post and edit events.</p>
      <div class="field"><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <p class="error" id="loginError" hidden></p>
      <div><button class="btn btn-primary" type="submit">Sign in</button></div>
    </form>
  </div>

  <main class="wrap" id="app" hidden>
    <div id="warnings"></div>
    <div class="tabs" role="tablist" aria-label="Admin sections">
      <button type="button" role="tab" data-tab="events" aria-selected="true">Events</button>
      <button type="button" role="tab" data-tab="employees" aria-selected="false">Employees</button>
      <button type="button" role="tab" data-tab="reports" aria-selected="false">Reports</button>
    </div>

    <section id="tab-events" role="tabpanel">
      <div class="admin">
        <aside class="panel">
          <div class="panel-head">
            <h2>Events</h2>
            <button class="btn btn-primary" id="newBtn" type="button">New event</button>
          </div>
          <div class="panel-body" style="padding:10px 16px">
            <div class="seg" role="group" aria-label="Show">
              <button id="tabUp" type="button" aria-pressed="true">Upcoming</button>
              <button id="tabPast" type="button" aria-pressed="false">Past</button>
            </div>
          </div>
          <ul class="elist" id="elist"></ul>
        </aside>
        <div>
          <section class="panel" id="editor"></section>
          <section class="panel" id="people" hidden></section>
        </div>
      </div>
    </section>

    <section id="tab-employees" role="tabpanel" hidden>
      <section class="panel">
        <div class="panel-head"><h2>Upload employees</h2></div>
        <div class="panel-body" id="upload"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2 id="rosterTitle">Employees</h2>
          <div class="btnrow">
            <button class="btn btn-secondary" id="rosterExport" type="button">Download Excel</button>
            <button class="btn btn-primary" id="addEmp" type="button">Add employee</button>
          </div>
        </div>
        <div class="panel-body">
          <div class="toolbar">
            <input type="search" id="rSearch" placeholder="Search name or ID" aria-label="Search employees">
            <select id="rCompany" aria-label="Company"></select>
            <select id="rStatus" aria-label="Access">
              <option value="active">Can sign in</option>
              <option value="off">Access turned off</option>
              <option value="">Everyone</option>
            </select>
          </div>
          <div class="scroll table-wrap" id="rosterTable"></div>
        </div>
      </section>
    </section>

    <section id="tab-reports" role="tabpanel" hidden>
      <section class="panel">
        <div class="panel-head">
          <h2>All events</h2>
          <div class="btnrow">
            <button class="btn btn-secondary" id="sumCsv" type="button">Download CSV</button>
            <button class="btn btn-secondary" id="sumXlsx" type="button">Download Excel</button>
          </div>
        </div>
        <div class="panel-body" id="summary"></div>
      </section>
    </section>
  </main>

  <dialog id="dlg" aria-labelledby="dlgTitle"><div id="dlgBody"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="/shared.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
